[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accessibility-auditor"
version = "1.0.0"
description = "Actionable WCAG-oriented HTML checks with plain-language fixes and reports."
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12", "requests>=2.32"]

[project.scripts]
a11y-audit = "a11y_auditor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
